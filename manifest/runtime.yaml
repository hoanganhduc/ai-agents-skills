   # hard breach (fraction of N): checkpoint + abort + fall back\nlocal_wall_budget_h = 2.0     # a local run must finish within this budget or it offloads\n\n# ---------------------------------------------------------------------------\n# Hetzner Cloud lane (peer to Kaggle / Modal / GitHub Actions; the offload tier after Modal\n# for non-GPU work). Agents drive the full lifecycle (provision -> run -> collect ->\n# DESTROY) under hard cost caps. A powered-off server still bills -- only DELETE\n# stops it -- so teardown must run on every terminal path. GPU work is out of\n# scope in v1, so the router skips Hetzner and continues to the next GPU-capable\n# lane. Disabled until HCLOUD_TOKEN (from a dedicated least-privilege Hetzner\n# project) is set and `doctor` passes.\n# ---------------------------------------------------------------------------\n[hetzner]\nenabled = false               # off until HCLOUD_TOKEN is present and `doctor` passes\nlocation = \"nbg1\"             # default provisioning location; preflight availability-checks the\n                             # live datacenter list and picks an orderable location from the allow-list\nallowed_locations = [\"nbg1\", \"hel1\", \"sin\"]  # current orderable regions (fsn1 has no orderable types)\nimage = \"ubuntu-24.04\"\nbundle_root = \"/absolute/path/to/operator-approved/hetzner-bundles\" # required upload root;\n                                                                 # every job is an immediate child\nproject_identity = \"replace-with-stable-dedicated-project-identity\" # exact non-secret operator identity;\n                                                                    # binds labels, leases, and broad deletion\nreaper_lease_file = \"~/.local/state/ai-agents-skills/hetzner-reaper-lease.json\" # owner-private 0600 lease under an owner-controlled parent chain\n# must equal the --scheduler-id your scheduler passes to attest\n# (crontab recipe: cron:user:$(id -un); systemd --user recipe: hetzner-reaper.timer)\nreaper_scheduler_id = \"cron:user:<your login>\"\nreaper_lease_max_age_seconds = 900            # hard maximum is 15 minutes; stale evidence fails closed\nmonthly_eur_cap = 0.0         # 0 = rely on the per-job / per-day caps only\nmax_eur_per_job = 3.0         # auto-approve envelope: worst-case <= EUR 3/job (larger needs human confirm)\nmax_eur_per_day = 3.0         # append-only day ledger halts provisioning at this cap\nmax_server_hours = 6.0        # dead-man's-switch TTL; worst-case reservation = rate x ceil(hours) x count + IPv4\nmax_concurrent_servers = 2    # the Hetzner project server-limit enforces this too\ngpu_server_types = []         # empty in v1: GPU work skips Hetzner\n\n# Server rate card (approximate public Hetzner Cloud list prices in EUR/hour, current\n# orderable x86 generation; override per account). The router picks the cheapest adequate\n# type -- CPX22 (2 cores) for small jobs, CPX62 (16 AMD cores) for <=16-way, else CCX63\n# (48 dedicated cores). ARM cax* is supply-constrained and omitted. wall_h = core_h / vcpu.\n[hetzner.server_types.cpx22]\nvcpu = 2\nram_gb = 4\narch = \"x86\"\neur_per_hour = 0.0180\n\n[hetzner.server_types.cpx62]\nvcpu = 16\nram_gb = 32\narch = \"x86\"\neur_per_hour = 0.1550\n\n[hetzner.server_types.ccx63]\nvcpu = 48\nram_gb = 192\narch = \"x86\"\neur_per_hour = 1.3678\n\n# ---------------------------------------------------------------------------\n# Kaggle Kernels lane (peer to Modal / Hetzner / GitHub Actions; the FIRST offload\n# tier after local). Kaggle runs async kernels (push a script + kernel-metadata,\n# poll status, download output), each capped at a 12h session on ~4 vCPU / ~32 GB.\n# CPU sessions are FREE and do NOT consume the weekly ~30h GPU quota, so CPU jobs are\n# ungated by quota (limited only by the 12h/session and concurrency caps). Kaggle has\n# no clean quota API, so GPU usage is bounded by a self-imposed weekly GPU-hour cap\n# read from a local usage ledger. Kernels auto-stop at 12h and cost nothing, so there\n# is NO cost gate, NO reaper, and NO teardown. A job longer than 12h spans multiple\n# kernel runs (push a chunk -> download checkpoints -> re-push to resume). Auth is the\n# new single Kaggle API token supplied via the KAGGLE_API_TOKEN environment variable (or\n# ~/.kaggle/access_token) -- NOT the legacy KAGGLE_USERNAME + KAGGLE_KEY pair or a\n# kaggle.json. kagglehub (>=0.4.1) validates the token and the kaggle CLI (>=1.8.0) runs\n# the kernel ops. Disabled until KAGGLE_API_TOKEN is set in the environment and `doctor`\n# passes. ToS: keep to modest, legitimate research workloads; verify the current Kaggle\n# terms permit this use before the first live run (the build makes no live Kaggle calls).\n# ---------------------------------------------------------------------------\n[kaggle]\nenabled = false              # off until KAGGLE_API_TOKEN is present and `doctor` passes\nweekly_gpu_hours_cap = 18.0  # self-imposed weekly GPU-hour cap (a local ledger; ~60% of the ~30h\n                             # floating quota, mirroring the GHA 60% idea). CPU work is ungated.\nmax_runs = 5                 # safety bound on the multi-run resume loop (rounds per job)\nconcurrency = 5              # max concurrent kernels (Kaggle's concurrent-session limit is ~5)\nsession_hours = 12.0         # Kaggle's hard per-kernel session cap (CPU and GPU)\nkernel_cores = 4             # per-kernel vCPU (free tier) -- drives the #runs estimate\nkernel_ram_gb = 32.0         # per-kernel RAM (free tier) -- a job over this is inadequate\n\n# ---------------------------------------------------------------------------\n# Multi-backend parallel fan-out (v2). Fan-out is a SCHEDULER ON TOP of the\n# per-lane probes/drivers: it splits ONE large divisible job (M independent,\n# resumable chunks) across SEVERAL lanes AT ONCE -- some chunks local, some free\n# (Kaggle), some paid (Hetzner/Modal) -- each lane sized to its spare capacity, to\n# minimise makespan (time until every chunk is back) while minimising cost. Small\n# jobs keep using the single-lane router; fan-out is opt-in and only for large\n# divisible jobs (declared chunk count >= min_chunks). The allocator water-fills\n# chunks by cost-efficiency (free/cheap lanes first) and balances finish-times,\n# minimising  speed_cost_weight * norm(makespan) + (1 - speed_cost_weight) *\n# norm(cost). speed_cost_weight in [0,1] is the per-job knob (0 = cheapest / free\n# lanes only, accept slower; 1 = fastest / recruit paid lanes; 0.5 = blend);\n# job policy.speed_cost_weight overrides this default. The per-core-hour rates,\n# per-eur rate, and startup latencies feed ONLY the objective -- the HARD RAILS\n# (per-lane budget caps, the EUR3/day auto-approve envelope, the GitHub Actions\n# 60% cumulative-minutes cap, Kaggle's weekly GPU-hour quota, and local's\n# self-preservation load-cap) are enforced as per-lane chunk ceilings that a\n# speed-leaning knob can never breach. Local (Oracle Cloud) is NOT free -- its\n# per-core-hour cost enters the model; Kaggle is the free lane.\n# ---------------------------------------------------------------------------\n[fanout]\nenabled = false              # off by default; opt-in for large divisible batch jobs\nspeed_cost_weight = 0.5      # default objective knob (0 cheapest .. 1 fastest); per-job overridable\nmin_chunks = 8               # below this many chunks, use the single-lane router instead\nusd_per_eur = 1.08           # normalise Hetzner EUR into the objective's USD cost term\nlocal_usd_per_core_hour = 0.006   # local Oracle box is NOT free; its cost enters the objective\nmodal_usd_per_core_hour = 0.10    # Modal remote CPU per-core-hour (objective cost only)\nmodal_slots = 16             # Modal parallel width used for makespan estimation\ngha_slots = 20               # GitHub Actions matrix parallel width for makespan estimation\nlocal_startup_seconds = 5.0       # fixed per-lane startup latency before the first result\nkaggle_startup_seconds = 300.0    # Kaggle kernels queue/start latency\nmodal_startup_seconds = 45.0\nhetzner_startup_seconds = 180.0   # provision + boot latency\ngha_startup_seconds = 60.0        # Actions runner queue latency\n"
