name: Installer Tests

on:
  pull_request:
    paths:
      - ".github/workflows/tests.yml"
      - ".github/scripts/**"
      - ".github/workflows/docs.yml"
      - "Makefile"
      - "make.ps1"
      - "README.md"
      - "docs/**"
      - "installer/**"
      - "tests/**"
      - "tools/**"
      - "manifest/**"
      - "canonical/**"
      - "targets/**"
      - "pyproject.toml"
      - "docs/requirements.txt"
  push:
    paths:
      - ".github/workflows/tests.yml"
      - ".github/scripts/**"
      - ".github/workflows/docs.yml"
      - "Makefile"
      - "make.ps1"
      - "README.md"
      - "docs/**"
      - "installer/**"
      - "tests/**"
      - "tools/**"
      - "manifest/**"
      - "canonical/**"
      - "targets/**"
      - "pyproject.toml"
      - "docs/requirements.txt"

permissions:
  contents: read

# One matrix per branch at a time. A push that lands while the previous matrix
# is still running makes that matrix answer a question nobody is asking any
# more, and the Windows job alone holds a runner for a quarter of an hour, so
# the superseded run is cancelled instead of finishing. ``head_ref`` collapses a
# pull request onto the branch that opened it, which would otherwise run the
# same commits twice. The default branch is exempt: its result is the published
# status of the repository, and a later push must not erase the answer for an
# earlier one.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Run sanitizer checks
        run: make sanitize-check

      - name: Run static checks
        run: make static-check

      - name: Install and report containment support
        run: .github/scripts/containment-support.sh

      - name: Install runtime smoke dependencies
        run: python -m pip install networkx psutil requests

      - name: Install attested system Node runtime
        run: sudo apt-get update && sudo apt-get install -y nodejs

      - name: Check Kaggle CI regressions
        run: >-
          python .github/scripts/ci_test_checkout.py -- python -m unittest -v
          tests.test_ci_kaggle_contracts
          tests.test_discovery.DiscoveryTests.test_shared_venv_position_in_every_linux_candidate_set
          tests.test_installer.AntigravityTargetTests.test_removing_the_old_payload_also_retires_its_state_record
          tests.test_secret_entrypoints.PosixSecretEntrypointTests.test_kaggle_doctor_resolves_guarded_access_token_without_cross_lane_secrets

      - name: Run unit tests
        run: python .github/scripts/ci_test_checkout.py -- make test

      - name: Run runtime smoke
        run: make runtime-smoke

      - name: Verify generated docs are current
        run: make docs-check

      - name: Build docs site
        run: |
          python -m pip install -r docs/requirements.txt
          make docs-site

  linux-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Run fake-root lifecycle matrix
        run: python .github/scripts/ci_test_checkout.py -- make lifecycle-test ARGS="--matrix stress --platform-shape all"

  linux-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install real Chromium
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Capture and verify against file:// fixtures (network forbidden)
        env:
          RUNTIME: canonical/runtime/skills/url-to-screenshot-runtime
          FIXTURES: canonical/runtime/skills/url-to-screenshot-runtime/u2s/htmlfixtures
        run: |
          set -euo pipefail
          export URL_TO_SCREENSHOT_BROWSER="$(command -v chrome || command -v google-chrome || command -v chromium)"
          echo "browser: $URL_TO_SCREENSHOT_BROWSER"
          OUT="$RUNNER_TEMP/u2s-capture"
          mkdir -p "$OUT"

          # Golden page captures and verifies (file:// fixtures need --allow-file-urls).
          python "$RUNTIME/url_to_screenshot_runtime.py" capture --allow-file-urls --no-sandbox --engine cdp \
            --url "file://$PWD/$FIXTURES/plain.html" --out "$OUT/plain.png" --consent off
          python "$RUNTIME/url_to_screenshot_runtime.py" verify --png "$OUT/plain.png" | tee "$OUT/plain.verify.json"
          python -c "import json,sys; d=json.load(open('$OUT/plain.verify.json')); sys.exit(0 if d['final_verdict']=='VERIFIED' else 1)"

          # Consent removal does not blank the page (still VERIFIED after removal).
          python "$RUNTIME/url_to_screenshot_runtime.py" capture --allow-file-urls --no-sandbox --engine cdp \
            --url "file://$PWD/$FIXTURES/consent.html" --out "$OUT/consent.png" --consent on
          python "$RUNTIME/url_to_screenshot_runtime.py" verify --png "$OUT/consent.png" | tee "$OUT/consent.verify.json"
          python -c "import json,sys; d=json.load(open('$OUT/consent.verify.json')); sys.exit(0 if d['final_verdict']=='VERIFIED' else 1)"

          # Full-page (tall.html) height exceeds the 800px viewport.
          python "$RUNTIME/url_to_screenshot_runtime.py" capture --allow-file-urls --no-sandbox --engine cdp \
            --url "file://$PWD/$FIXTURES/tall.html" --out "$OUT/tall.png" --full-page --consent off
          python "$RUNTIME/url_to_screenshot_runtime.py" verify --png "$OUT/tall.png" | tee "$OUT/tall.verify.json"
          python -c "import json,sys; d=json.load(open('$OUT/tall.verify.json')); h=d['detail']['height']; print('full-page height',h); sys.exit(0 if d['final_verdict']=='VERIFIED' and h>800 else 1)"

          # slow.html with --timeout 1 yields BLOCKED_TIMEOUT with the process tree reaped:
          # no leftover url2png_* temp dir and no child Chromium PID remain.
          TMP_BASE="${TMPDIR:-/tmp}"
          before_pids="$(pgrep -c -x chrome 2>/dev/null || true):$(pgrep -c -x chromium 2>/dev/null || true)"
          set +e
          python "$RUNTIME/url_to_screenshot_runtime.py" capture --allow-file-urls --no-sandbox --engine cdp \
            --url "file://$PWD/$FIXTURES/slow.html" --out "$OUT/slow.png" --timeout 1 --consent off | tee "$OUT/slow.json"
          rc=$?
          set -e
          test "$rc" -ne 0 || (echo "expected nonzero exit on --timeout 1" && exit 1)
          python -c "import json,sys; d=json.load(open('$OUT/slow.json')); sys.exit(0 if d.get('status')=='BLOCKED_TIMEOUT' else 1)"
          sleep 3
          test -z "$(ls -d "$TMP_BASE"/url2png_* 2>/dev/null || true)" || (echo "leftover url2png_* temp dir" && exit 1)
          test -z "$(ls -d /tmp/url2png_* 2>/dev/null || true)" || (echo "leftover /tmp/url2png_* temp dir" && exit 1)
          after_chrome="$(pgrep -c -x chrome 2>/dev/null || true)"
          after_chromium="$(pgrep -c -x chromium 2>/dev/null || true)"
          echo "chromium pids before=$before_pids after chrome=$after_chrome chromium=$after_chromium"
          test "${after_chrome:-0}" = "0" || (echo "leftover chrome child PID after reap" && exit 1)
          test "${after_chromium:-0}" = "0" || (echo "leftover chromium child PID after reap" && exit 1)

      - name: Print and structurally verify PDF fixtures
        run: |
          export URL_TO_SCREENSHOT_BROWSER="$(command -v chrome || command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$URL_TO_SCREENSHOT_BROWSER"
          python -m unittest -v tests/test_url_to_pdf_runtime.py -k ChromiumPdfFixtureTests

  python-compat:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python compatibility dependencies
        run: python -m pip install 'tomli>=2; python_version < "3.11"' networkx psutil requests

      - name: Install attested system Node runtime
        run: sudo apt-get update && sudo apt-get install -y nodejs

      - name: Run sanitizer checks
        run: make sanitize-check

      - name: Run static checks
        run: make static-check

      - name: Install and report containment support
        run: .github/scripts/containment-support.sh

      - name: Run unit tests
        run: python .github/scripts/ci_test_checkout.py -- make test

      - name: Verify generated docs are current
        run: make docs-check

  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Run sanitizer checks
        run: make sanitize-check

      - name: Run static checks
        run: make static-check

      - name: Install runtime smoke dependencies
        run: python -m pip install networkx psutil requests

      - name: Prepare attested system Python TOML dependency
        run: |
          # Credential wrappers intentionally use /usr/bin/python3, not the
          # setup-python interpreter. Provision only this ephemeral CI image.
          if ! /usr/bin/python3 -I -c 'import tomllib' 2>/dev/null && \
             ! /usr/bin/python3 -I -c 'import tomli' 2>/dev/null; then
            WHEELS="$RUNNER_TEMP/aas-system-python-wheels"
            python -m pip download --no-deps --only-binary=:all: \
              --platform any --implementation py --abi none \
              --dest "$WHEELS" tomli==2.2.1
            WHEEL="$WHEELS/tomli-2.2.1-py3-none-any.whl"
            # PyPI's published SHA256 for the universal (not CPython-specific) wheel.
            printf '%s  %s\n' cb55c73c5f4408779d0cf3eef9f762b9c9f147a77de7b258bef0a5628adc85cc "$WHEEL" | shasum -a 256 -c -
            SYSTEM_SITE="$(/usr/bin/python3 -I -c 'import sysconfig; print(sysconfig.get_path("purelib"))')"
            sudo "$(command -v python)" -I -m pip install --no-index --no-deps --no-compile \
              --target "$SYSTEM_SITE" "$WHEEL"
          fi
          /usr/bin/python3 -I -c 'import importlib,sys; m=importlib.import_module("tomllib" if sys.version_info >= (3,11) else "tomli"); assert m.loads("ready=true")["ready"] is True; print("attested Python:",sys.version.split()[0],"TOML:",m.__name__)'

      - name: Check native POSIX wrapper compatibility
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          python .github/scripts/posix-wrapper-compatibility.py
          --report "$RUNNER_TEMP/posix-wrapper-compatibility.json"

      - name: Preserve wrapper compatibility evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: macos-wrapper-compatibility-${{ github.run_attempt }}
          path: ${{ runner.temp }}/posix-wrapper-compatibility.json
          if-no-files-found: warn
          retention-days: 14

      - name: Check POSIX credential entrypoints
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest tests.test_secret_entrypoints tests.test_suite_text_encoding -v

      - name: Run runtime smoke
        run: make runtime-smoke

      - name: Run unit tests
        run: python .github/scripts/ci_test_checkout.py -- make test

      - name: Verify generated docs are current
        run: make docs-check

      - name: Run platform lifecycle smoke
        run: python .github/scripts/ci_test_checkout.py -- make lifecycle-test ARGS="--matrix default --platform-shape macos"

      - name: Run Antigravity-only lifecycle smoke
        run: python .github/scripts/ci_test_checkout.py -- make lifecycle-test ARGS="--scenario antigravity-only-auto --platform-shape macos"

      - name: Run Kimi-only lifecycle smoke
        run: python .github/scripts/ci_test_checkout.py -- make lifecycle-test ARGS="--scenario kimi-only-auto --platform-shape macos"

  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install runtime smoke dependencies
        run: python -m pip install networkx psutil requests

      - name: Check command help
        shell: pwsh
        run: ./make.ps1 help

      - name: List artifacts
        shell: pwsh
        run: ./make.ps1 list-artifacts

      - name: Check make.ps1 propagates command failures
        shell: pwsh
        run: |
          $child = Start-Process pwsh `
            -ArgumentList '-NoProfile', '-NonInteractive', '-File', './make.ps1', 'definitely-not-a-command' `
            -Wait -PassThru -NoNewWindow
          if ($child.ExitCode -eq 0) { throw "make.ps1 swallowed a command failure" }
          exit 0

      - name: Run sanitizer checks
        shell: pwsh
        run: ./make.ps1 sanitize-check

      - name: Run static checks
        shell: pwsh
        run: ./make.ps1 static-check

      - name: Run unit tests
        shell: pwsh
        run: ./make.ps1 test

      # Runtime smoke and the lifecycle smokes perform real installs, and
      # native Windows mutation is disabled until installer writes,
      # replacements, and deletions remain bound to the validated Windows
      # handle. The unit suite asserts that refusal; re-add the smoke steps
      # when handle-bound mutation lands.
      - name: Verify generated docs are current
        shell: pwsh
        run: ./make.ps1 docs-check
